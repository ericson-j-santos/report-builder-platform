[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "report-builder-platform"
version = "0.1.0"
description = "Reusable deterministic paginated report builder"
requires-python = ">=3.11"

[project.scripts]
report-builder = "report_builder.report_factory:main"

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
