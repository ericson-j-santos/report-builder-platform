name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Detect project
        id: project
        shell: bash
        run: |
          if [[ -f pyproject.toml ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Bootstrap repository
        if: steps.project.outputs.ready != 'true'
        run: echo "Repository initialized; functional project not yet present on this ref."
      - name: Install test dependency
        if: steps.project.outputs.ready == 'true'
        run: python -m pip install --disable-pip-version-check pytest build
      - name: Compile
        if: steps.project.outputs.ready == 'true'
        run: python -m compileall -q src tests
      - name: Test
        if: steps.project.outputs.ready == 'true'
        run: python -m pytest -q
      - name: Build wheel
        if: steps.project.outputs.ready == 'true'
        run: python -m build --wheel
      - name: Install built wheel
        if: steps.project.outputs.ready == 'true'
        run: python -m pip install --force-reinstall dist/*.whl
      - name: Smoke installed CLI
        if: steps.project.outputs.ready == 'true'
        shell: bash
        run: |
          cd /tmp
          report-builder validate --spec "$GITHUB_WORKSPACE/examples/items_by_status.json"
          report-builder generate --spec "$GITHUB_WORKSPACE/examples/items_by_status.json" --output /tmp/ItemsByStatus.rdl
          test -s /tmp/ItemsByStatus.rdl
