name: CI

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: report-builder-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and quality dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install ".[dev,yaml]"

      - name: Lint
        run: python -m ruff check .

      - name: Compile
        run: python -m compileall -q src tests

      - name: Test with branch coverage
        run: |
          python -m coverage run -m pytest -q
          python -m coverage report

      - name: Build wheel
        run: python -m build --wheel

      - name: Install built wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -m pip check

      - name: E2E installed CLI positive and idempotency controls
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp
          report-builder validate --spec "$GITHUB_WORKSPACE/examples/items_by_status.json"
          report-builder generate --spec "$GITHUB_WORKSPACE/examples/items_by_status.json" --output /tmp/ItemsByStatus-1.rdl
          report-builder generate --spec "$GITHUB_WORKSPACE/examples/items_by_status.json" --output /tmp/ItemsByStatus-2.rdl
          test -s /tmp/ItemsByStatus-1.rdl
          cmp /tmp/ItemsByStatus-1.rdl /tmp/ItemsByStatus-2.rdl

      - name: E2E installed CLI negative control
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          source = json.loads(
              Path("examples/items_by_status.json").read_text(encoding="utf-8")
          )
          source["datasets"][0]["query"] = (
              "SELECT Status INTO dbo.ItemsCopy FROM dbo.Items"
          )
          Path("/tmp/invalid-report-spec.json").write_text(
              json.dumps(source),
              encoding="utf-8",
          )
          PY
          if report-builder validate --spec /tmp/invalid-report-spec.json >/tmp/negative.out 2>/tmp/negative.err; then
            echo "negative control unexpectedly succeeded"
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("/tmp/negative.out").read_text(encoding="utf-8"))
          assert result["status"] == "failed"
          assert result["message"].startswith("Falha ao processar")
          PY
